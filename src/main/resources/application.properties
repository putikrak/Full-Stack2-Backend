spring.application.name=arena-manager-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/esports_arena_manager?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

app.jwt.secreto=${JWT_SECRETO:EsportsArenaManagerClaveSecretaSuperSegura2026DuocUC!}
app.jwt.expiracion-minutos=120

springdoc.swagger-ui.path=/swagger-ui.html
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173}